<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="tbl-title tbl-desc">
  <title id="tbl-title">Employment of young people by sector in 2005 and 2010 (%)</title>
  <desc id="tbl-desc">Official academic data table showing the percentage of young people employed across seven sectors in 2005 and 2010.</desc>

  <!-- Crisp Academic Card Surface -->
  <rect x="0" y="0" width="960" height="540" rx="16" fill="#FFFFFF" />
  <rect x="1" y="1" width="958" height="538" rx="15" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Top Academic Pill & Header -->
  <rect x="372" y="20" width="216" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
  <text x="480" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#047857">IELTS NOVA · TASK 1 TABLE</text>

  <text x="480" y="72" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#0F172A">Percentage of young people employed by sector</text>
  <text x="480" y="95" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Comparison in one country across 2005 and 2010 (%)</text>

  <!-- Table Outer Frame: x=68..892 (w=824), y=120..500 (8 rows x 47.5px = 380px) -->
  <defs>
    <clipPath id="table-clip">
      <rect x="68" y="120" width="824" height="380" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#table-clip)">
    <!-- Table Header Row (Midnight Slate w/ Emerald Accent Strip) -->
    <rect x="68" y="120" width="824" height="52" fill="#0F172A" />
    <rect x="68" y="168" width="824" height="4" fill="#10B981" />

    <!-- Alternating Subtle Emerald-Slate Rows -->
    <rect x="68" y="172" width="824" height="46.8" fill="#F8FAFC" />
    <rect x="68" y="218.8" width="824" height="46.8" fill="#FFFFFF" />
    <rect x="68" y="265.6" width="824" height="46.8" fill="#F8FAFC" />
    <rect x="68" y="312.4" width="824" height="46.8" fill="#ECFDF5" fill-opacity="0.55" />
    <rect x="68" y="359.2" width="824" height="46.8" fill="#F8FAFC" />
    <rect x="68" y="406.0" width="824" height="46.8" fill="#FFFFFF" />
    <rect x="68" y="452.8" width="824" height="47.2" fill="#F8FAFC" />
  </g>

  <!-- Crisp Horizontal Row Dividers -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="68" y1="218.8" x2="892" y2="218.8" />
    <line x1="68" y1="265.6" x2="892" y2="265.6" />
    <line x1="68" y1="312.4" x2="892" y2="312.4" />
    <line x1="68" y1="359.2" x2="892" y2="359.2" />
    <line x1="68" y1="406.0" x2="892" y2="406.0" />
    <line x1="68" y1="452.8" x2="892" y2="452.8" />
  </g>

  <!-- Vertical Column Dividers -->
  <line x1="452" y1="120" x2="452" y2="500" stroke="#CBD5E1" stroke-opacity="0.55" stroke-width="1.2" />
  <line x1="672" y1="120" x2="672" y2="500" stroke="#CBD5E1" stroke-opacity="0.55" stroke-width="1.2" />

  <!-- Rounded Outer Table Border -->
  <rect x="68" y="120" width="824" height="380" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Column Headers -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">
    <text x="100" y="151" text-anchor="start">Sector</text>
    <text x="562" y="151" text-anchor="middle" fill="#E2E8F0">2005</text>
    <text x="782" y="151" text-anchor="middle" fill="#34D399">2010</text>
  </g>

  <!-- Table Data Rows -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A">
    <!-- Row 1: Agriculture -->
    <text x="100" y="201">Agriculture</text>
    <text x="562" y="201" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">7</text>
    <text x="782" y="201" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">8</text>

    <!-- Row 2: Business -->
    <text x="100" y="248">Business</text>
    <text x="562" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">7</text>
    <text x="782" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">10</text>

    <!-- Row 3: Manufacturing -->
    <text x="100" y="295">Manufacturing</text>
    <text x="562" y="295" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">21</text>
    <text x="782" y="295" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">14</text>

    <!-- Row 4: Shops, restaurants & hotels -->
    <text x="100" y="341.5">Shops, restaurants &amp; hotels</text>
    <text x="562" y="341.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">20</text>
    <text x="782" y="341.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="800" fill="#059669">33</text>

    <!-- Row 5: Social services -->
    <text x="100" y="388.5">Social services</text>
    <text x="562" y="388.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="800" fill="#0F172A">34</text>
    <text x="782" y="388.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">22</text>

    <!-- Row 6: Transport -->
    <text x="100" y="435">Transport</text>
    <text x="562" y="435" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">5</text>
    <text x="782" y="435" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">4</text>

    <!-- Row 7: Other -->
    <text x="100" y="482">Other</text>
    <text x="562" y="482" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">7</text>
    <text x="782" y="482" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">7</text>
  </g>
</svg>
