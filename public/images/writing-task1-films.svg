<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">The number of films produced by five countries (2007–2009)</title>
  <desc id="chart-desc">Grouped bar chart showing film production across countries A, B, C, D, and E in 2007, 2008, and 2009.</desc>

  <!-- Crisp Academic Card Background -->
  <rect x="0" y="0" width="960" height="540" rx="16" fill="#FFFFFF" />
  <rect x="1" y="1" width="958" height="538" rx="15" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Top Academic Pill & Title -->
  <rect x="378" y="20" width="204" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
  <text x="480" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#047857">IELTS NOVA · TASK 1 DATA</text>

  <text x="480" y="72" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0F172A">The number of films produced by five countries</text>
  <text x="480" y="95" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Comparison across five countries (A–E) between 2007 and 2009</text>

  <!-- Horizontal Gridlines (y = 435 - val * 3.2; range 0..100 => y 435..115) -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="100" y1="115" x2="900" y2="115" />
    <line x1="100" y1="147" x2="900" y2="147" />
    <line x1="100" y1="179" x2="900" y2="179" />
    <line x1="100" y1="211" x2="900" y2="211" />
    <line x1="100" y1="243" x2="900" y2="243" />
    <line x1="100" y1="275" x2="900" y2="275" />
    <line x1="100" y1="307" x2="900" y2="307" />
    <line x1="100" y1="339" x2="900" y2="339" />
    <line x1="100" y1="371" x2="900" y2="371" />
    <line x1="100" y1="403" x2="900" y2="403" />
  </g>

  <!-- Y-Axis Labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#475569" text-anchor="end">
    <text x="86" y="120">100</text>
    <text x="86" y="152">90</text>
    <text x="86" y="184">80</text>
    <text x="86" y="216">70</text>
    <text x="86" y="248">60</text>
    <text x="86" y="280">50</text>
    <text x="86" y="312">40</text>
    <text x="86" y="344">30</text>
    <text x="86" y="376">20</text>
    <text x="86" y="408">10</text>
    <text x="86" y="440">0</text>
  </g>

  <!-- Y-Axis Title -->
  <text x="34" y="275" text-anchor="middle" transform="rotate(-90 34 275)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8" fill="#64748B">NUMBER OF FILMS</text>

  <!-- Bars: 2007 (#0F172A Slate), 2008 (#E2E8F0 Mist w/ #334155 border), 2009 (#10B981 Emerald) -->
  <!-- Country A (center 180): 88, 88, 80 -->
  <g>
    <rect x="129" y="153.4" width="30" height="281.6" rx="2.5" fill="#0F172A" />
    <rect x="165" y="153.4" width="30" height="281.6" rx="2.5" fill="#E2E8F0" stroke="#334155" stroke-width="1.5" />
    <rect x="201" y="179" width="30" height="256" rx="2.5" fill="#10B981" />
  </g>

  <!-- Country B (center 340): 48, 50, 70 -->
  <g>
    <rect x="289" y="281.4" width="30" height="153.6" rx="2.5" fill="#0F172A" />
    <rect x="325" y="275" width="30" height="160" rx="2.5" fill="#E2E8F0" stroke="#334155" stroke-width="1.5" />
    <rect x="361" y="211" width="30" height="224" rx="2.5" fill="#10B981" />
  </g>

  <!-- Country C (center 500): 8, 14, 19 -->
  <g>
    <rect x="449" y="409.4" width="30" height="25.6" rx="2" fill="#0F172A" />
    <rect x="485" y="390.2" width="30" height="44.8" rx="2" fill="#E2E8F0" stroke="#334155" stroke-width="1.5" />
    <rect x="521" y="374.2" width="30" height="60.8" rx="2" fill="#10B981" />
  </g>

  <!-- Country D (center 660): 17, 10, 14 -->
  <g>
    <rect x="609" y="380.6" width="30" height="54.4" rx="2" fill="#0F172A" />
    <rect x="645" y="403" width="30" height="32" rx="2" fill="#E2E8F0" stroke="#334155" stroke-width="1.5" />
    <rect x="681" y="390.2" width="30" height="44.8" rx="2" fill="#10B981" />
  </g>

  <!-- Country E (center 820): 10, 11, 12 -->
  <g>
    <rect x="769" y="403" width="30" height="32" rx="2" fill="#0F172A" />
    <rect x="805" y="399.8" width="30" height="35.2" rx="2" fill="#E2E8F0" stroke="#334155" stroke-width="1.5" />
    <rect x="841" y="396.6" width="30" height="38.4" rx="2" fill="#10B981" />
  </g>

  <!-- Crisp Primary Axes -->
  <line x1="100" y1="115" x2="100" y2="435" stroke="#334155" stroke-width="2" />
  <line x1="100" y1="435" x2="900" y2="435" stroke="#334155" stroke-width="2" />

  <!-- X-Axis Country Labels -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle">
    <text x="180" y="462">A</text>
    <text x="340" y="462">B</text>
    <text x="500" y="462">C</text>
    <text x="660" y="462">D</text>
    <text x="820" y="462">E</text>
  </g>

  <!-- Bottom Centered Legend -->
  <g transform="translate(324, 488)">
    <rect x="0" y="0" width="312" height="34" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />

    <rect x="20" y="9" width="16" height="16" rx="4" fill="#0F172A" />
    <text x="44" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#0F172A">2007</text>

    <rect x="116" y="9" width="16" height="16" rx="4" fill="#E2E8F0" stroke="#334155" stroke-width="1.5" />
    <text x="140" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#0F172A">2008</text>

    <rect x="212" y="9" width="16" height="16" rx="4" fill="#10B981" />
    <text x="236" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#047857">2009</text>
  </g>
</svg>
